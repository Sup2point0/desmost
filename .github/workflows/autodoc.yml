name: 'autodoc'

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/autodoc.yml'
      - '**/options.ts'
      - 'Rakefile'

jobs:
  doc:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 'git / checkout'
        uses: actions/checkout@v7
      
      - name: 'rake / doc'
        run: |
          rake
      
      - name: 'git / push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --staged --quiet || git commit -m "update docs"
          git push
