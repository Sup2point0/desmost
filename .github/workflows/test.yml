name: 'test'

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test.yml'
      - 'CHANGELOG.md'
      - 'desmost/package.json'
      - 'desmost/tests/**/*.test.ts'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './desmost/'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: './desmost/package-lock.json'

      - name: '> npm ci'
        run: |
          npm ci
      
      - name: '> npm run test'
        run: |
          npm run test
