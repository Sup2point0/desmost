name: 'test'

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test.yml'
      - 'CHANGELOG.md'
      - 'desmost/tests/**/*.test.ts'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './desmost/'

    steps:
      - name: 'git / checkout'
        uses: actions/checkout@v7

      - name: 'node / setup'
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: './desmost/package-lock.json'

      - name: 'npm / install'
        run: |
          npm ci
      
      - name: 'npm / test'
        run: |
          npm run test
